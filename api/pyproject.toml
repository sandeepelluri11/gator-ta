[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gator-ta"
version = "0.1.0"
description = "GatorTA: a course Q&A agent with hybrid retrieval over lecture material"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandeep Elluri" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "redis>=5.0",
  "pypdf>=4.3",
  "tiktoken>=0.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "fakeredis>=2.24",
  "asgi-lifespan>=2.1",
  "ruff>=0.6",
]

[project.scripts]
gator-ingest = "gator_ta.ingest.cli:main"
gator-eval = "gator_ta.eval.run:main"

[project.urls]
Repository = "https://github.com/sandeepelluri11/gator-ta"

[tool.hatch.build.targets.wheel]
packages = ["gator_ta"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
