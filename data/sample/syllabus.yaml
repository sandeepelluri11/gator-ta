grading:
  breakdown:
    homework: 40
    midterm: 20
    project: 35
    participation: 5
  late_policy: >-
    Each student has four late days for the term, used in whole-day increments on homework
    only. After late days are exhausted, work loses 10% per day and is not accepted more than
    three days late. Late days cannot be applied to the midterm or the final project.
  collaboration_policy: >-
    You may discuss homework problems with classmates, but all submitted code and writing must
    be your own. Using LLM coding assistants is allowed on homework if you disclose it in the
    README; it is not allowed on the midterm.
